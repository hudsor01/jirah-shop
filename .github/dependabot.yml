version: 2
updates:
  # bun, not npm. This repo's lockfile is bun.lock, and CI installs with
  # `bun install --frozen-lockfile`. The npm updater edits package.json but
  # cannot write bun.lock, so every PR it opened failed at install with
  # "lockfile had changes, but lockfile is frozen".
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"